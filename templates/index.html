<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis Camera Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Axis Camera Setup</h1>
        <form id="cameraForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="ip">Camera IP Address</label>
                {{ form.ip(placeholder="192.168.1.100") }}
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                {{ form.username() }}
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                {{ form.password() }}
            </div>
            <hr>
            <div class="form-group">
                <label for="brightness">Brightness (0-100)</label>
                {{ form.brightness() }}
            </div>
            <div class="form-group">
                <label for="contrast">Contrast (0-100)</label>
                {{ form.contrast() }}
            </div>
            <div class="form-group">
                <label for="zipstream">Zipstream Strength</label>
                {{ form.zipstream() }}
            </div>
            <div class="button-group">
                <button type="button" class="btn-apply" onclick="submitForm('/apply')">Apply Settings</button>
                <button type="button" class="btn-download" onclick="submitForm('/download_bat')">Download .bat</button>
            </div>
        </form>
        <div id="status"></div>
    </div>

    <script>
        async function submitForm(action) {
            const form = document.getElementById('cameraForm');
            const formData = new FormData(form);
            const statusDiv = document.getElementById('status');

            if (action === '/download_bat') {
                const formElement = document.createElement('form');
                formElement.method = 'POST';
                formElement.action = action;

                for (const [key, value] of formData.entries()) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = value;
                    formElement.appendChild(input);
                }

                document.body.appendChild(formElement);
                formElement.submit();
                document.body.removeChild(formElement);
                statusDiv.innerText = "Generating .bat file...";
                statusDiv.style.color = "blue";
                return;
            }

            statusDiv.innerText = "Applying settings...";
            statusDiv.style.color = "blue";

            try {
                const response = await fetch(action, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.text();
                statusDiv.innerText = result;
                statusDiv.style.color = response.ok ? "green" : "red";
            } catch (error) {
                statusDiv.innerText = "Error: " + error.message;
                statusDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
